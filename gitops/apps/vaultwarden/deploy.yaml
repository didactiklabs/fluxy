kind: Deployment
apiVersion: apps/v1
metadata:
  name: vaultwarden
  labels:
    app: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      # Workaround musl DNS resolver issues in K8s (parallel A/AAAA + ndots:5)
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          - name: single-request
          - name: single-request-reopen
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.35.4-alpine
          ports:
            - name: web
              containerPort: 80
          env:
            - name: DOMAIN
              value: "https://vaultwarden.didactiklabs.io"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden
                  key: admin_token
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "false"
            - name: SHOW_PASSWORD_HINT
              value: "false"
            - name: WEBSOCKET_ENABLED
              value: "true"
            - name: LOG_LEVEL
              value: "info"
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_ONLY
              value: "true"
            - name: SSO_ORGANIZATIONS_INVIT
              value: "true"
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vaultwarden
                  key: client_id
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vaultwarden
                  key: client_secret
            - name: SSO_AUTHORITY
              value: "https://auth.didactiklabs.io/application/o/vaultwarden/"
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              memory: 200Mi
            requests:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vaultwarden
  data:
    - secretKey: admin_token
      remoteRef:
        key: secrets/vaultwarden/server
        property: admin_token
    - secretKey: client_id
      remoteRef:
        key: secrets/vaultwarden/server
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: secrets/vaultwarden/server
        property: client_secret
